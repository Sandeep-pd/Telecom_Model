name: Deploy Telecom AI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t sandeep0030/telecom-ai:latest .

      - name: Push Docker image
        run: |
          docker push sandeep0030/telecom-ai:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sandeep0030/telecom-ai:latest

            docker stop telecom-ai || true
            docker rm telecom-ai || true

            docker run -d \
              --name telecom-ai \
              --restart unless-stopped \
              -p 8000:8000 \
              sandeep0030/telecom-ai:latest

            docker image prune -f